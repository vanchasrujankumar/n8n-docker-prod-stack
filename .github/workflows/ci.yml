name: CI - Validate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for validation
        run: |
          cp .env.example .env
          sed -i "s/^N8N_HOST=.*/N8N_HOST=ci.example.com/" .env
          sed -i "s/^DOMAIN_NAME=.*/DOMAIN_NAME=example.com/" .env
          sed -i "s/^SSL_EMAIL=.*/SSL_EMAIL=ci@example.com/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_pass/" .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci_key_32char_ci_key_32char_ci_key_/" .env
          sed -i "s/^N8N_USER_MANAGEMENT_JWT_SECRET=.*/N8N_USER_MANAGEMENT_JWT_SECRET=ci_jwt_32char_ci_jwt_32char_ci_/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci_grafana/" .env
          sed -i "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci_minio/" .env

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml --env-file .env config --quiet

      - name: Validate compose.dev.yaml
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Validate Traefik YAML
        run: |
          python3 -c "
          with open('docker/traefik/traefik.yml') as f:
              content = f.read()
          assert 'entryPoints' in content
          assert 'certificatesResolvers' in content
          assert 'letsencrypt' in content
          print('traefik.yml: valid structure')
          "

      - name: Validate env template
        run: |
          for var in DOMAIN_NAME N8N_HOST SSL_EMAIL DB_USER DB_PASSWORD DB_NAME \
                     N8N_ENCRYPTION_KEY N8N_USER_MANAGEMENT_JWT_SECRET \
                     GRAFANA_ADMIN_PASSWORD MINIO_ROOT_PASSWORD; do
            grep -qE "^${var}=" .env.example && echo "  OK: $var" || { echo "  MISSING: $var"; exit 1; }
          done

      - name: Lint shell scripts
        run: shellcheck -S style scripts/*.sh tests/*.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
        continue-on-error: true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [ lint, security ]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          echo "DOMAIN_NAME=localhost" > .env
          echo "N8N_HOST=localhost" >> .env
          echo "SSL_EMAIL=ci@example.com" >> .env
          echo "DB_USER=n8n" >> .env
          echo "DB_PASSWORD=ci_test_pass_123" >> .env
          echo "DB_NAME=n8n_production" >> .env
          echo "N8N_ENCRYPTION_KEY=ci_test_encryption_key_32char_abc123" >> .env
          echo "N8N_USER_MANAGEMENT_JWT_SECRET=ci_test_jwt_secret_32chars_abc12345" >> .env
          echo "TRAEFIK_AUTH_USER=admin" >> .env
          echo "TRAEFIK_AUTH_PASS_HASH=" >> .env
          echo "GRAFANA_ADMIN_USER=admin" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=ci_grafana_pass_123" >> .env
          echo "MINIO_ROOT_USER=minioadmin" >> .env
          echo "MINIO_ROOT_PASSWORD=ci_minio_pass_123" >> .env
          echo "EXECUTIONS_PROCESS=main" >> .env
          echo "N8N_METRICS=false" >> .env

      - name: Create Docker network
        run: docker network create n8n-web || true

      - name: Start Postgres
        run: |
          docker compose -f compose.yaml --env-file .env up -d postgres --wait

      - name: Pull n8n image
        run: docker compose -f compose.yaml --env-file .env pull n8n

      - name: Start n8n
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml --env-file .env up -d n8n --wait --wait-timeout 300
          docker compose -f compose.yaml --env-file .env ps

      - name: Verify PostgreSQL
        run: docker exec n8n-postgres pg_isready -U n8n -d n8n_production

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml --env-file .env down -v
