name: CI - Validate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for validation
        run: |
          cp .env.example .env
          sed -i "s/^N8N_HOST=.*/N8N_HOST=ci.example.com/" .env
          sed -i "s/^DOMAIN_NAME=.*/DOMAIN_NAME=example.com/" .env
          sed -i "s/^SSL_EMAIL=.*/SSL_EMAIL=ci@example.com/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_pass/" .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci_key_32char_ci_key_32char_ci_key_/" .env
          sed -i "s/^N8N_USER_MANAGEMENT_JWT_SECRET=.*/N8N_USER_MANAGEMENT_JWT_SECRET=ci_jwt_32char_ci_jwt_32char_ci_/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci_grafana/" .env
          sed -i "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci_minio/" .env

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml --env-file .env config --quiet

      - name: Validate compose.dev.yaml
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Validate Traefik YAML
        run: |
          python3 -c "
          with open('docker/traefik/traefik.yml') as f:
              content = f.read()
          assert 'entryPoints' in content
          assert 'certificatesResolvers' in content
          assert 'letsencrypt' in content
          print('traefik.yml: valid structure')
          "

      - name: Validate env template
        run: |
          for var in DOMAIN_NAME N8N_HOST SSL_EMAIL DB_USER DB_PASSWORD DB_NAME \
                     N8N_ENCRYPTION_KEY N8N_USER_MANAGEMENT_JWT_SECRET \
                     GRAFANA_ADMIN_PASSWORD MINIO_ROOT_PASSWORD; do
            grep -qE "^${var}=" .env.example && echo "  OK: $var" || { echo "  MISSING: $var"; exit 1; }
          done

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S style scripts/*.sh tests/*.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y -qq wget apt-transport-https gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy

      - name: Run Trivy filesystem scan
        run: |
          trivy fs --severity CRITICAL,HIGH --exit-code 1 --no-progress . || echo "Trivy found issues (non-blocking)"
        continue-on-error: true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [ lint, security ]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^N8N_HOST=.*/N8N_HOST=localhost/" .env
          sed -i "s/^DOMAIN_NAME=.*/DOMAIN_NAME=localhost/" .env
          sed -i "s/^SSL_EMAIL=.*/SSL_EMAIL=test@example.com/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_test_pass/" .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci_test_encryption_key_32ch_abc/" .env
          sed -i "s/^N8N_USER_MANAGEMENT_JWT_SECRET=.*/N8N_USER_MANAGEMENT_JWT_SECRET=ci_test_jwt_secret_32chars_a/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci_grafana_pass/" .env
          sed -i "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci_minio_pass/" .env

      - name: Create Docker network
        run: docker network create n8n-web || true

      - name: Start services
        run: |
          docker compose -f compose.yaml --env-file .env up -d --wait 2>&1 || {
            docker compose -f compose.yaml logs --tail=50
            exit 1
          }

      - name: Wait for n8n API
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5678/healthz | grep -q 200; then
              echo "n8n API healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          docker compose -f compose.yaml logs --tail=50 n8n
          exit 1

      - name: Verify PostgreSQL
        run: docker exec n8n-postgres pg_isready -U n8n -d n8n_production

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v
