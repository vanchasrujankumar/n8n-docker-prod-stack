name: CI - Validate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: compose.yaml
  COMPOSE_DEV_FILE: compose.dev.yaml

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Validate compose.dev.yaml
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Validate Traefik YAML
        run: |
          python3 -c "
          import json, sys
          with open('docker/traefik/traefik.yml') as f:
              content = f.read()
          # Basic YAML check - count colons and structure
          assert 'entryPoints' in content, 'Missing entryPoints'
          assert 'certificatesResolvers' in content, 'Missing certificatesResolvers'
          assert 'letsencrypt' in content, 'Missing letsencrypt'
          print('traefik.yml: valid')
          "

      - name: Validate env template
        run: |
          VARS="DOMAIN_NAME N8N_HOST SSL_EMAIL DB_USER DB_PASSWORD DB_NAME N8N_ENCRYPTION_KEY N8N_USER_MANAGEMENT_JWT_SECRET GRAFANA_ADMIN_PASSWORD MINIO_ROOT_PASSWORD"
          for var in $VARS; do
            if ! grep -qE "^${var}=" .env.example; then
              echo "Missing: $var"
              exit 1
            fi
          done
          echo "All required env vars present"

      - name: Lint shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh tests/*.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck scripts/*.sh tests/*.sh
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          hide-progress: true
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Check secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [ lint, security ]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^N8N_HOST=.*/N8N_HOST=localhost/" .env
          sed -i "s/^DOMAIN_NAME=.*/DOMAIN_NAME=localhost/" .env
          sed -i "s/^SSL_EMAIL=.*/SSL_EMAIL=test@example.com/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_test_pass/" .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci_test_encryption_key_32ch_abc/" .env
          sed -i "s/^N8N_USER_MANAGEMENT_JWT_SECRET=.*/N8N_USER_MANAGEMENT_JWT_SECRET=ci_test_jwt_secret_32chars_a/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci_grafana_pass/" .env
          sed -i "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci_minio_pass/" .env

      - name: Create Docker network
        run: docker network create n8n-web || true

      - name: Start services
        run: docker compose -f compose.yaml --env-file .env up -d --wait 2>&1 || docker compose -f compose.yaml logs

      - name: Wait for n8n API
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5678/healthz | grep -q 200; then
              echo "n8n API healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yaml logs --tail=50 n8n
          exit 1

      - name: Verify PostgreSQL
        run: docker exec n8n-postgres pg_isready -U n8n -d n8n_production

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v
