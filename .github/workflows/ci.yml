name: CI - Validate & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: compose.yaml
  COMPOSE_DEV_FILE: compose.dev.yaml

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "Validating compose.yaml..."
          docker compose -f compose.yaml config --quiet 2>&1 || {
            echo "compose.yaml validation failed"
            exit 1
          }
          echo "Validating compose.dev.yaml..."
          docker compose -f compose.dev.yaml config --quiet 2>&1 || {
            echo "compose.dev.yaml validation failed"
            exit 1
          }

      - name: Lint Traefik config
        run: |
          if [ -f docker/traefik/traefik.yml ]; then
            python3 -c "
import yaml, sys
try:
    with open('docker/traefik/traefik.yml') as f:
        yaml.safe_load(f)
    print('traefik.yml: valid YAML')
except Exception as e:
    print(f'traefik.yml: invalid - {e}')
    sys.exit(1)
"
          fi

      - name: Lint shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh tests/*.sh
          else
            echo "shellcheck not available, installing..."
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck scripts/*.sh tests/*.sh
          fi

      - name: Validate .env.example completeness
        run: |
          REQUIRED_VARS="DOMAIN_NAME N8N_HOST SSL_EMAIL DB_USER DB_PASSWORD DB_NAME N8N_ENCRYPTION_KEY N8N_USER_MANAGEMENT_JWT_SECRET"
          for var in $REQUIRED_VARS; do
            if ! grep -qE "^${var}=" .env.example; then
              echo "Missing required env var: ${var}"
              exit 1
            fi
          done
          echo "All required env vars present in .env.example"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          hide-progress: true
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

      - name: Check secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          cp .env.example .env
          sed -i "s/^N8N_HOST=.*/N8N_HOST=localhost/" .env
          sed -i "s/^DOMAIN_NAME=.*/DOMAIN_NAME=localhost/" .env
          sed -i "s/^SSL_EMAIL=.*/SSL_EMAIL=test@example.com/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_test_password/" .env
          sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci_test_encryption_key_32chars_abcd/" .env
          sed -i "s/^N8N_USER_MANAGEMENT_JWT_SECRET=.*/N8N_USER_MANAGEMENT_JWT_SECRET=ci_test_jwt_secret_32chars_abcd/" .env

      - name: Create Docker network
        run: docker network create n8n-web || true

      - name: Start services
        run: |
          docker compose -f compose.yaml --env-file .env up -d --wait 2>&1 || {
            echo "Stack failed to start. Dumping logs..."
            docker compose -f compose.yaml logs
            exit 1
          }

      - name: Run health check tests
        run: |
          chmod +x tests/test_health.sh
          bash tests/test_health.sh

      - name: Verify n8n API is responding
        run: |
          echo "Waiting for n8n API..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5678/healthz | grep -q 200; then
              echo "n8n API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "n8n API did not become healthy"
          docker compose -f compose.yaml logs --tail=50 n8n
          exit 1

      - name: Verify PostgreSQL is accepting connections
        run: |
          docker exec n8n-postgres pg_isready -U n8n -d n8n_production || {
            echo "PostgreSQL is not ready"
            docker compose -f compose.yaml logs --tail=50 postgres
            exit 1
          }

      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v
