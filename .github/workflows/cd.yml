name: CD - Deploy

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/n8n-docker-prod-stack' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'prod') || 'dev' }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      env_file: ${{ steps.set-env.outputs.env_file }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
              echo "env_file=.env" >> $GITHUB_OUTPUT
            else
              echo "env_file=.env.dev" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "env_file=.env" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "env_file=.env.dev" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ needs.determine-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-env]
    environment:
      name: ${{ needs.determine-env.outputs.environment }}

    steps:
      - name: Validate confirmation (manual deploy)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: Deployment not confirmed. Type 'deploy' to confirm."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create remote directory
        run: |
          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
            "sudo mkdir -p ${{ env.DEPLOY_PATH }} && sudo chown -R ${{ env.SSH_USER }}:${{ env.SSH_USER }} ${{ env.DEPLOY_PATH }}"

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.dev' \
            --exclude '.env.prod' \
            --exclude 'backups' \
            --exclude 'node_modules' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Copy environment file
        run: |
          if [ "${{ needs.determine-env.outputs.environment }}" = "prod" ]; then
            echo "Creating .env on remote from secrets..."
            ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
              echo 'DOMAIN_NAME=${{ secrets.N8N_HOST }}' > ${{ env.DEPLOY_PATH }}/.env
              echo 'N8N_HOST=${{ secrets.N8N_HOST }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'SSL_EMAIL=${{ secrets.SSL_EMAIL }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'DB_USER=${{ secrets.DB_USER }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'DB_NAME=n8n_production' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'N8N_ENCRYPTION_KEY=${{ secrets.N8N_ENCRYPTION_KEY }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'N8N_USER_MANAGEMENT_JWT_SECRET=${{ secrets.N8N_USER_MANAGEMENT_JWT_SECRET }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'TRAEFIK_AUTH_USER=${{ secrets.TRAEFIK_AUTH_USER }}' >> ${{ env.DEPLOY_PATH }}/.env
              echo 'TRAEFIK_AUTH_PASS_HASH=${{ secrets.TRAEFIK_AUTH_PASS_HASH }}' >> ${{ env.DEPLOY_PATH }}/.env
            "
          else
            echo "Creating .env.dev on remote..."
            ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
              echo 'N8N_HOST=dev.n8n.local' > ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'DB_USER=n8n' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD || 'n8n_dev_pass' }}' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'DB_NAME=n8n_dev' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'N8N_ENCRYPTION_KEY=${{ secrets.DEV_N8N_ENCRYPTION_KEY || 'dev_encryption_key_32chars_dev_env' }}' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'N8N_USER_MANAGEMENT_JWT_SECRET=${{ secrets.DEV_N8N_JWT_SECRET || 'dev_jwt_secret_32chars_dev_env' }}' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'N8N_LOG_LEVEL=debug' >> ${{ env.DEPLOY_PATH }}/.env.dev
              echo 'N8N_METRICS=false' >> ${{ env.DEPLOY_PATH }}/.env.dev
            "
          fi

      - name: Deploy stack
        run: |
          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            chmod +x scripts/deploy.sh

            if [ '${{ needs.determine-env.outputs.environment }}' = 'prod' ]; then
              # Ensure Docker network exists
              docker network inspect n8n-web >/dev/null 2>&1 || docker network create n8n-web

              # Pull latest images
              docker compose pull

              # Deploy
              docker compose up -d --remove-orphans
            else
              # Dev deployment
              docker compose -f compose.dev.yaml --env-file .env.dev pull
              docker compose -f compose.dev.yaml --env-file .env.dev -p n8n-dev up -d --remove-orphans
            fi
          "

      - name: Verify deployment
        run: |
          sleep 15
          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            bash tests/test_health.sh
          "

      - name: Post-deploy status
        if: success()
        run: |
          echo "::notice::Deployment to ${{ needs.determine-env.outputs.environment }} completed successfully."
          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            echo '--- Container Status ---'
            docker compose ps
            echo ''
            echo '--- Resource Usage ---'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
          "

      - name: Rollback on failure
        if: failure() && needs.determine-env.outputs.environment == 'prod'
        run: |
          echo "::warning::Deployment failed. Rolling back..."
          ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            docker compose down
            # Re-deploy previous version if backup exists
            if docker compose images | grep -q n8n; then
              docker compose up -d
            fi
          "
