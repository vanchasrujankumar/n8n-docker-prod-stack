groups:
  - name: n8n_alerts
    interval: 30s
    rules:
      - alert: N8nDown
        expr: up{job="n8n"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "n8n instance is down"
          description: "n8n has been unreachable for more than 1 minute."

      - alert: N8nHighExecutionFailures
        expr: rate(n8n_execution_total{status="failed"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High n8n execution failure rate"
          description: "Execution failures are above 0.1/s over 5 minutes."

      - alert: N8nWorkflowError
        expr: n8n_workflow_total{status="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "n8n workflow in error state"
          description: "At least one workflow is in failed status."

      - alert: N8nHighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "n8n host memory > 85%"
          description: "Host memory usage is above 85% for more than 5 minutes."

      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "PostgreSQL database has been down for 30 seconds."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count{datname="n8n_production"} > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection count"
          description: "PostgreSQL has more than 50 active connections."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 10%"
          description: "Available disk space is less than 10%."
